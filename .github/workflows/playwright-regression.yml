name: Playwright Regression

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: playwright-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  project-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run project checks
        run: npm run check

  regression:
    needs: project-checks
    name: Playwright (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: chromium
            label: Chromium
            os: ubuntu-latest
            playwright_project_group: chromium
            install_command: npx playwright install --with-deps chromium
          - id: firefox
            label: Firefox
            os: ubuntu-latest
            playwright_project_group: firefox
            install_command: npx playwright install --with-deps firefox
          - id: webkit
            label: Safari WebKit
            os: macos-latest
            playwright_project_group: webkit
            install_command: npx playwright install webkit
    env:
      HAKOMACHI_PLAYWRIGHT_PROJECTS: ${{ matrix.playwright_project_group }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: ${{ matrix.install_command }}

      - name: Run Playwright regression suite
        run: npm run check:browser:ci

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-artifacts-${{ matrix.id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
